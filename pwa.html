<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TeslaMate">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<title>TeslaMate</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

<!-- Leaflet (maps) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; width: 100%; overflow: hidden; background: #F2F2F7; }
  @media (prefers-color-scheme: dark) { html, body { background: #000000; } }
  body { font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  #root { width: 100%; height: 100%; }
  button { -webkit-appearance: none; appearance: none; }

  /* OSM tiles are light-only: invert them in dark theme (only tiles, not markers/route) */
  .tm-map-dark .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(0.95) contrast(0.85); }

  /* Disable text selection (feels more native) */
  body { user-select: none; -webkit-user-select: none; }

  @keyframes tmpulse { 0%, 100% { opacity: 1 } 50% { opacity: .45 } }
  .tm-pulse { animation: tmpulse 1.4s ease-in-out infinite; }
  @keyframes tmslide { from { left: -30% } to { left: 100% } }
  .tm-indeterminate { animation: tmslide 1.3s ease-in-out infinite; }
  @keyframes tmspin { to { transform: rotate(360deg) } }
  .tm-spin { animation: tmspin .9s linear infinite; }
  /* Dual range slider: two native inputs stacked, only the thumbs take touches */
  .tm-range { position: absolute; inset: 0; width: 100%; margin: 0; background: none; pointer-events: none; -webkit-appearance: none; appearance: none; height: 44px; }
  .tm-range::-webkit-slider-runnable-track { background: none; height: 44px; }
  .tm-range::-webkit-slider-thumb { -webkit-appearance: none; pointer-events: auto; width: 30px; height: 30px; margin-top: 7px; border-radius: 15px;
    background: #fff; border: 0; box-shadow: 0 1px 4px rgba(0,0,0,0.35), 0 0 0 0.5px rgba(0,0,0,0.1); cursor: grab; }
  .tm-range::-moz-range-thumb { pointer-events: auto; width: 30px; height: 30px; border-radius: 15px; background: #fff; border: 0; box-shadow: 0 1px 4px rgba(0,0,0,0.35); }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Runtime config (edit on the server; not exposed in UI) -->
<script src="config.js"></script>

<!-- App -->
<script type="text/babel" src="api.jsx"></script>
<script type="text/babel" src="ui/theme.jsx"></script>
<script type="text/babel" src="ui/kit.jsx"></script>
<script type="text/babel" src="screens/status.jsx"></script>
<script type="text/babel" src="screens/drives.jsx"></script>
<script type="text/babel" src="screens/charges.jsx"></script>
<script type="text/babel" src="screens/stats.jsx"></script>
<script type="text/babel" src="screens/more.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</head>
<body>
<div id="root"></div>

<script>
  // Register service worker (only on HTTPS / localhost)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW reg failed:', err));
    });
  }
</script>
</body>
</html>
