# nginx config of the image: the app is served under /pwa/ (same host as teslamateapi's /api/v1).
server {
    listen 80;
    root /usr/share/nginx/html;
    # Behind an HTTPS reverse proxy: relative redirects, otherwise they would point to http://...:80
    absolute_redirect off;

    location = /pwa { return 301 /pwa/; }

    location /pwa/ {
        index pwa.html;
        try_files $uri $uri/ =404;
        # Small files: always revalidated (ETag -> 304), so an update shows up immediately
        add_header Cache-Control "no-cache";
    }

    # Babel standalone reads them as text, but a sane MIME type avoids surprises
    location ~ ^/pwa/.+\.jsx$ {
        default_type text/javascript;
        add_header Cache-Control "no-cache";
    }

    # Nothing else is served
    location / { return 404; }
}
